AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Cue API on AWS: ECS Fargate behind an HTTPS Application Load Balancer, private RDS PostgreSQL 17,
  ECR, Secrets Manager and a GitHub Actions deploy role. Runbook: docs/deployment/AWS_DEPLOYMENT.md.

Parameters:
  ApiDomainName:
    Type: String
    Description: Public API hostname you own, e.g. api.example.com (gets a free ACM certificate).
    AllowedPattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
  ImageTag:
    Type: String
    Default: bootstrap
    Description: API image tag in this stack's ECR repository. Set by the deploy workflow.
  DesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1, 2]
    Description: Running API tasks. Keep 0 until the first image is pushed and secrets are filled.
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
  ClerkJwtIssuer:
    Type: String
    Description: Issuer of the Clerk PRODUCTION instance (its Frontend API URL).
  ClerkAuthorizedParties:
    Type: String
    Default: app://bundle
    Description: Comma-separated Clerk azp allow-list. app://bundle is the packaged desktop renderer.
  CorsOrigin:
    Type: String
    Default: ''
    Description: Optional single browser origin (app://bundle lets the desktop status check read health).
  EnableChat:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: "'true' requires the three Nexconn values below and NEXCONN_APP_SECRET in the app secret."
  NexconnAppKey:
    Type: String
    Default: ''
  NexconnPrimaryApiDomain:
    Type: String
    Default: ''
  NexconnSecondaryApiDomain:
    Type: String
    Default: ''
  GitHubRepository:
    Type: String
    Default: mano45sudo-lgtm/Build_Together
    Description: owner/repo allowed to deploy (only from the main branch).
  CreateGitHubOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: "'false' if this AWS account already has the token.actions.githubusercontent.com provider."

Conditions:
  HasCorsOrigin: !Not [!Equals [!Ref CorsOrigin, '']]
  ChatEnabled: !Equals [!Ref EnableChat, 'true']
  CreateOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, 'true']

Resources:
  # ---------------------------------------------------------------- network
  # No NAT gateway (~$32/month): API tasks sit in public subnets with a public IP for outbound
  # calls (ECR, Clerk, Nexconn) but accept inbound traffic only from the load balancer. The
  # database lives in subnets with no internet route at all.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS (HTTP only redirects)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API tasks and the migration task; inbound only from the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 4000
          ToPort: 4000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL only from API and migration tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ServiceSecurityGroup

  # ---------------------------------------------------------------- database
  DatabaseMasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: RDS master credentials (generated; never in the template)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"cue_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true # URL-safe inside DATABASE_URL

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private database subnets
      SubnetIds: [!Ref DatabaseSubnetA, !Ref DatabaseSubnetB]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      # RDS no longer creates 16.x or bare-major instances; minor upgrades apply automatically.
      EngineVersion: '17.11'
      DBName: cue
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: !Sub '{{resolve:secretsmanager:${DatabaseMasterSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseMasterSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      DeletionProtection: true
      AutoMinorVersionUpgrade: true
      # In the RDS global bundle shipped in the image (apps/api/certs/rds-global-bundle.pem).
      CACertificateIdentifier: rds-ca-rsa2048-g1

  # Single string the API and Prisma read; built from the generated password and the endpoint.
  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: DATABASE_URL for the Cue API and migrations
      SecretString: !Sub 'postgresql://cue_admin:{{resolve:secretsmanager:${DatabaseMasterSecret}:SecretString:password}}@${Database.Endpoint.Address}:${Database.Endpoint.Port}/cue'

  # Fill CLERK_SECRET_KEY (and NEXCONN_APP_SECRET if chat is on) in the console after creation.
  # CloudFormation only writes this value on create, so console edits are not overwritten.
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Cue API application secrets (set real values in the console)
      SecretString: '{"CLERK_SECRET_KEY":"REPLACE_ME","NEXCONN_APP_SECRET":""}'

  # ---------------------------------------------------------------- image registry and logs
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep the 20 newest images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},
          "action":{"type":"expire"}}]}

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}'
      RetentionInDays: 30

  # ---------------------------------------------------------------- ECS
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-cue-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DatabaseUrlSecret, !Ref AppSecret]

  Cluster:
    Type: AWS::ECS::Cluster

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-api'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub '${Repository.RepositoryUri}:${ImageTag}'
          Essential: true
          PortMappings: [{ ContainerPort: 4000, Protocol: tcp }]
          StopTimeout: 30 # graceful shutdown needs ~13 s (8 s drain + 5 s Prisma disconnect)
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: PORT, Value: '4000' }
            # The load balancer is the only path to the tasks (security group), so exactly one hop.
            - { Name: TRUST_PROXY_HOPS, Value: '1' }
            - { Name: DATABASE_SSL_MODE, Value: verify-full }
            - { Name: DATABASE_SSL_ROOT_CERT, Value: /app/certs/rds-global-bundle.pem }
            - { Name: CLERK_JWT_ISSUER, Value: !Ref ClerkJwtIssuer }
            - { Name: CLERK_AUTHORIZED_PARTIES, Value: !Ref ClerkAuthorizedParties }
            - !If [HasCorsOrigin, { Name: CORS_ORIGIN, Value: !Ref CorsOrigin }, !Ref AWS::NoValue]
            - !If [
                ChatEnabled,
                { Name: NEXCONN_APP_KEY, Value: !Ref NexconnAppKey },
                !Ref AWS::NoValue,
              ]
            - !If [
                ChatEnabled,
                { Name: NEXCONN_PRIMARY_API_DOMAIN, Value: !Ref NexconnPrimaryApiDomain },
                !Ref AWS::NoValue,
              ]
            - !If [
                ChatEnabled,
                { Name: NEXCONN_SECONDARY_API_DOMAIN, Value: !Ref NexconnSecondaryApiDomain },
                !Ref AWS::NoValue,
              ]
          Secrets:
            - { Name: DATABASE_URL, ValueFrom: !Ref DatabaseUrlSecret }
            - { Name: CLERK_SECRET_KEY, ValueFrom: !Sub '${AppSecret}:CLERK_SECRET_KEY::' }
            - !If
              - ChatEnabled
              - { Name: NEXCONN_APP_SECRET, ValueFrom: !Sub '${AppSecret}:NEXCONN_APP_SECRET::' }
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  # One-off task run by the deploy workflow BEFORE the service rolls out. Only database settings.
  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-migrate'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: migrate
          Image: !Sub '${Repository.RepositoryUri}:${ImageTag}'
          Essential: true
          Command: [npm, run, db:migrate:deploy]
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: DATABASE_SSL_MODE, Value: verify-full }
            - { Name: DATABASE_SSL_ROOT_CERT, Value: /app/certs/rds-global-bundle.pem }
          Secrets:
            - { Name: DATABASE_URL, ValueFrom: !Ref DatabaseUrlSecret }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: migrate

  # ---------------------------------------------------------------- HTTPS load balancer
  # Stack creation pauses here until you add the certificate's DNS validation record (runbook).
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref ApiDomainName
      ValidationMethod: DNS

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 4000
      # Liveness, not readiness: a database outage must not make ECS kill and restart healthy tasks.
      HealthCheckPath: /api/v1/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '15' }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref Certificate }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]

  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 }

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 30
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - { ContainerName: api, ContainerPort: 4000, TargetGroupArn: !Ref TargetGroup }

  # ---------------------------------------------------------------- GitHub Actions deploy role
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:ref:refs/heads/main'
      Policies:
        - PolicyName: deploy-cue-api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:RunTask
                  - ecs:DescribeTasks
                  - ecs:UpdateService
                  - ecs:DescribeServices
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt TaskExecutionRole.Arn
                Condition: { StringEquals: { iam:PassedToService: ecs-tasks.amazonaws.com } }
              - Effect: Allow
                Action:
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                Resource: !Ref AWS::StackId

Outputs:
  LoadBalancerDnsName:
    Description: Point your API hostname here with a CNAME record.
    Value: !GetAtt LoadBalancer.DNSName
  ApiUrl:
    Description: Desktop BT_API_BASE_URL for production builds.
    Value: !Sub 'https://${ApiDomainName}'
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  MigrationTaskFamily:
    Value: !Sub '${AWS::StackName}-migrate'
  TaskSubnets:
    Value: !Join [',', [!Ref PublicSubnetA, !Ref PublicSubnetB]]
  TaskSecurityGroup:
    Value: !Ref ServiceSecurityGroup
  AppSecretArn:
    Description: Fill CLERK_SECRET_KEY (and NEXCONN_APP_SECRET) here.
    Value: !Ref AppSecret
  GitHubDeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN repository variable.
    Value: !GetAtt GitHubDeployRole.Arn
